<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booking Confirmed - FestiFlow</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="header">
        <div class="container nav">
            <div class="nav-logo"><a href="dashboard.html"><i class="fa-solid fa-water"></i> FestiFlow</a></div>
        </div>
    </header>

    <div class="container mt-3" style="max-width: 600px; text-align: center;">
        <div class="card">
            <i class="fa-solid fa-circle-check fa-4x mb-1" style="color: var(--success);"></i>
            <h2 class="mb-1">Booking Confirmed!</h2>
            <p>Your slot has been successfully reserved. Please show the QR code below at the entry point.</p>
            
            <div class="mt-2 mb-2" style="background: #f1f5f9; padding: 20px; border-radius: var(--radius); display:inline-block; border: 2px dashed #cbd5e1;">
                <!-- Fake QR Code Placeholder -->
                <i class="fa-solid fa-qrcode fa-6x" style="color: #334155;"></i>
                <p class="mt-1"><strong>ID: <span id="booking-id">BKG-XXXX</span></strong></p>
            </div>
            
            <div class="mb-2 text-left" style="text-align: left; background: var(--surface); padding: 20px; border: 1px solid var(--border); border-radius: var(--radius);">
                <p class="mb-1"><strong>Location:</strong> Girgaon Chowpatty</p>
                <p class="mb-1"><strong>Time:</strong> 8:00 PM - 9:00 PM</p>
                <p class="mb-1"><strong>Group Size:</strong> 4</p>
                <p><strong>Status:</strong> <span class="badge badge-success">Confirmed</span></p>
            </div>
            
            <div class="flex gap-1" style="flex-direction: column;">
                <a href="dashboard.html" class="btn btn-primary btn-block">Back to Dashboard</a>
                <a href="#" class="btn btn-outline btn-block">Download Ticket</a>
            </div>
        </div>
    </div>

    <script>
        // Extract the mock booking ID from the URL and display it
        const urlParams = new URLSearchParams(window.location.search);
        const id = urlParams.get('id') || 'BKG-1234';
        document.getElementById('booking-id').innerText = id;
    </script>
</body>
</html>
