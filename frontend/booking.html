<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirm Booking - FestiFlow</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="fade-in">
    <header class="header">
        <div class="container nav">
            <div class="nav-logo"><a href="dashboard.html"><i class="fa-solid fa-water"></i> FestiFlow</a></div>
            <div class="nav-links">
                <a href="dashboard.html">Dashboard</a>
            </div>
        </div>
    </header>

    <div class="container mt-3 mb-3" style="max-width: 700px;">
        
        <!-- Booking Stepper -->
        <div class="stepper mb-3">
            <div class="step active">
                <div class="step-circle"><i class="fa-solid fa-check"></i></div>
                <span>Festival</span>
            </div>
            <div class="step active">
                <div class="step-circle"><i class="fa-solid fa-check"></i></div>
                <span>Point & Slot</span>
            </div>
            <div class="step active">
                <div class="step-circle">3</div>
                <span>Details</span>
            </div>
            <div class="step">
                <div class="step-circle">4</div>
                <span>Confirm</span>
            </div>
        </div>

        <div class="card" style="border-top: 4px solid var(--primary);">
            <h2 class="mb-2 text-center">Complete Your Booking</h2>
            
            <div class="mb-2" style="background: var(--bg-blue); padding: 20px; border-radius: var(--radius-sm); border: 1px solid #bfdbfe;">
                <h4 style="color: var(--secondary-dark); margin-bottom: 10px;"><i class="fa-solid fa-calendar-check"></i> Booking Summary</h4>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                    <div><small style="color: var(--text-secondary);">Festival</small><br><strong>Ganesh Visarjan 2024</strong></div>
                    <div><small style="color: var(--text-secondary);">Date</small><br><strong>Sept 17, 2024</strong></div>
                    <div><small style="color: var(--text-secondary);">Location</small><br><strong id="b-location"><i class="fa-solid fa-circle-notch fa-spin"></i></strong></div>
                    <div><small style="color: var(--text-secondary);">Time Slot</small><br><strong id="b-time"><i class="fa-solid fa-circle-notch fa-spin"></i></strong></div>
                </div>
            </div>
            
            <form id="booking-form">
                <div class="form-group">
                    <label>Group Size (Max 15)</label>
                    <input type="number" id="groupSize" class="form-control" min="1" max="15" required value="1">
                </div>
                <div class="form-group">
                    <label>Primary Contact (Optional)</label>
                    <input type="text" class="form-control" placeholder="+91 XXXXX XXXXX">
                </div>
                <div class="mt-3 flex gap-1">
                    <a href="points.html" class="btn btn-secondary btn-block">Back</a>
                    <button type="submit" class="btn btn-primary btn-block">Confirm Booking <i class="fa-solid fa-arrow-right"></i></button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", async () => {
            setTimeout(() => {
                document.getElementById('b-location').innerText = "Girgaon Chowpatty";
                document.getElementById('b-time').innerText = "8:00 PM - 9:00 PM";
            }, 300); // Simulate load
            
            document.getElementById('booking-form').addEventListener('submit', async (e) => {
                e.preventDefault();
                const groupSize = document.getElementById('groupSize').value;
                const btn = e.target.querySelector('button[type="submit"]');
                btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Processing...';
                
                const res = await api.bookSlot({ groupSize });
                window.location.href = `confirmation.html?id=${res.bookingId}`;
            });
        });
    </script>
</body>
</html>
