<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirm Booking - FestiFlow</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="header">
        <div class="container nav">
            <div class="nav-logo"><a href="dashboard.html"><i class="fa-solid fa-water"></i> FestiFlow</a></div>
            <div class="nav-links">
                <a href="dashboard.html">Dashboard</a>
            </div>
        </div>
    </header>

    <div class="container mt-3" style="max-width: 600px;">
        <div class="card">
            <h2 class="mb-2 text-center">Complete Your Booking</h2>
            
            <div style="background: var(--background); padding: 15px; border-radius: var(--radius); margin-bottom: 20px;">
                <p><strong>Festival:</strong> Ganesh Visarjan 2024</p>
                <p><strong>Location:</strong> <span id="b-location">Loading...</span></p>
                <p><strong>Time Slot:</strong> <span id="b-time">Loading...</span></p>
            </div>
            
            <form id="booking-form">
                <div class="form-group">
                    <label>Group Size (Max 15)</label>
                    <input type="number" id="groupSize" class="form-control" min="1" max="15" required value="1">
                </div>
                <div class="form-group">
                    <label>Primary Contact Number (Optional)</label>
                    <input type="text" class="form-control" placeholder="+91 XXXXX XXXXX">
                </div>
                <button type="submit" class="btn btn-primary btn-block mt-2">Confirm Booking</button>
                <a href="points.html" class="btn btn-outline btn-block mt-1">Cancel / Go Back</a>
            </form>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", async () => {
            // In a real app, we fetch point details based on the URL ?point=ID
            document.getElementById('b-location').innerText = "Girgaon Chowpatty (Marine Drive)";
            document.getElementById('b-time').innerText = "8:00 PM - 9:00 PM";
            
            document.getElementById('booking-form').addEventListener('submit', async (e) => {
                e.preventDefault();
                const groupSize = document.getElementById('groupSize').value;
                const btn = e.target.querySelector('button[type="submit"]');
                btn.innerText = "Processing...";
                
                // Simulate backend API call
                const res = await api.bookSlot({ groupSize });
                
                // Redirect to confirmation page
                window.location.href = `confirmation.html?id=${res.bookingId}`;
            });
        });
    </script>
</body>
</html>
