<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - FestiFlow</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container mt-3" style="max-width: 450px;">
        <div class="card text-center">
            <h2 class="mb-1" style="color: var(--primary);"><i class="fa-solid fa-water"></i> FestiFlow</h2>
            <p class="mb-2 text-center">Login to manage your bookings</p>
            
            <form action="dashboard.html" onsubmit="event.preventDefault(); window.location.href='dashboard.html';">
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" class="form-control" placeholder="student@example.com" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" class="form-control" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn btn-primary btn-block mt-1">Login</button>
            </form>
            
            <p class="mt-2"><small>Don't have an account? <a href="register.html" style="color: var(--primary); font-weight:600;">Register</a></small></p>
            <p><small><a href="index.html" style="color: var(--text);">Back to Home</a></small></p>
        </div>
    </div>
</body>
</html>
