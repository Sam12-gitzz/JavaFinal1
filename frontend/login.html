<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - FestiFlow</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="fade-in" style="display: flex; align-items: center; justify-content: center; min-height: 100vh;">
    
    <div class="container" style="width: 100%; max-width: 420px;">
        <div class="card text-center" style="padding: 40px 30px; border-top: 6px solid var(--primary); box-shadow: var(--shadow-lg);">
            <div style="width: 70px; height: 70px; background: var(--bg-warm); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 20px;">
                <i class="fa-solid fa-water fa-2x" style="color: var(--primary);"></i>
            </div>
            <h2 class="mb-1">Welcome Back</h2>
            <p class="mb-3" style="color: var(--text-secondary);">Login to manage your festive bookings</p>
            
            <form id="loginForm">
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="loginEmail" class="form-control" placeholder="student@example.com" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="loginPassword" class="form-control" placeholder="••••••••" required>
                </div>
                <div id="loginError" style="color: var(--danger); font-size: 0.9rem; display: none; text-align: left; margin-top: 5px; font-weight: 500;">Invalid email or password.</div>
                <button type="submit" class="btn btn-primary btn-block mt-2" style="font-size: 1.1rem; padding: 14px;">Login <i class="fa-solid fa-arrow-right"></i></button>
            </form>
            
            <p class="mt-3"><small>Don't have an account? <a href="register.html" style="color: var(--primary); font-weight:600;">Create one</a></small></p>
            <p class="mt-1"><small><a href="index.html" style="color: var(--text-secondary);"><i class="fa-solid fa-arrow-left"></i> Back to Home</a></small></p>
        </div>
    </div>

    <script>
        // Clear session if they hit the login page
        localStorage.removeItem('currentUser');

        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value;
            const pass = document.getElementById('loginPassword').value;
            const users = JSON.parse(localStorage.getItem('users') || '[]');

            const user = users.find(u => u.email === email && u.password === pass);

            if (user) {
                localStorage.setItem('currentUser', JSON.stringify({ id: user.id, name: user.name, email: user.email, isAdmin: user.isAdmin }));
                window.location.href = 'dashboard.html';
            } else {
                if(users.length === 0) {
                    const mockUser = { id: 'mock', name: email.split('@')[0], email: email, isAdmin: email === 'admin@festiflow.com' };
                    localStorage.setItem('currentUser', JSON.stringify(mockUser));
                    window.location.href = 'dashboard.html';
                } else {
                    document.getElementById('loginError').style.display = 'block';
                }
            }
        });
    </script>
</body>
</html>
