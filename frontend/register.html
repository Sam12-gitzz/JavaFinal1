<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - FestiFlow</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="fade-in" style="display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 40px 0;">
    
    <div class="container" style="width: 100%; max-width: 450px;">
        <div class="card text-center" style="padding: 40px 30px; border-top: 6px solid var(--secondary); box-shadow: var(--shadow-lg);">
            <div style="width: 70px; height: 70px; background: var(--bg-blue); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 20px;">
                <i class="fa-solid fa-user-plus fa-2x" style="color: var(--secondary);"></i>
            </div>
            <h2 class="mb-1">Join FestiFlow</h2>
            <p class="mb-3" style="color: var(--text-secondary);">Create an account to book your slot</p>
            
            <form action="login.html" onsubmit="event.preventDefault(); window.location.href='login.html';">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" class="form-control" placeholder="John Doe" required>
                </div>
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" class="form-control" placeholder="student@example.com" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" class="form-control" placeholder="••••••••" required>
                </div>
                <div class="form-group">
                    <label>Confirm Password</label>
                    <input type="password" class="form-control" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn btn-secondary btn-block mt-2" style="background: linear-gradient(135deg, var(--secondary), var(--secondary-dark)); color: white; border:none; padding: 14px; font-size: 1.1rem;">Create Account</button>
            </form>
            
            <p class="mt-3"><small>Already have an account? <a href="login.html" style="color: var(--secondary); font-weight:600;">Login here</a></small></p>
        </div>
    </div>
</body>
</html>
