<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - FestiFlow</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="js/tailwind-config.js"></script>
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/custom.css">
</head>
<body class="bg-slate-50 font-sans min-h-screen flex flex-col justify-between">
    
    <div id="navbar-placeholder"></div>

    <main class="flex-grow flex items-center justify-center p-4 py-12">
        <div class="w-full max-w-md bg-white rounded-2xl shadow-xl overflow-hidden" data-aos="fade-up" data-aos-duration="600">
            <div class="h-2 bg-gradient-to-r from-festival-orange to-festival-fuchsia w-full"></div>
            <div class="p-8 sm:p-10">
                <div class="w-20 h-20 bg-slate-100 rounded-full flex items-center justify-center mx-auto mb-6 shadow-inner">
                    <i class="fa-solid fa-user-plus text-3xl text-festival-fuchsia"></i>
                </div>
                
                <h2 class="text-3xl font-extrabold text-center text-festival-slate mb-2">Join FestiFlow</h2>
                <p class="text-center text-slate-500 mb-8 font-medium">Create an account to book your slot</p>
                
                <form id="registerForm" class="space-y-5">
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-2">Full Name</label>
                        <input type="text" id="regName" class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-festival-fuchsia focus:border-transparent transition-colors shadow-sm outline-none" placeholder="John Doe" required>
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-2">Email Address</label>
                        <input type="email" id="regEmail" class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-festival-fuchsia focus:border-transparent transition-colors shadow-sm outline-none" placeholder="student@example.com" required>
                        <span id="emailError" class="text-red-500 text-xs font-semibold mt-1 hidden">Please enter a valid email</span>
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-2">Password</label>
                        <input type="password" id="regPassword" class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-festival-fuchsia focus:border-transparent transition-colors shadow-sm outline-none" placeholder="••••••••" required>
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-2">Confirm Password</label>
                        <input type="password" id="regConfirmPassword" class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-festival-fuchsia focus:border-transparent transition-colors shadow-sm outline-none" placeholder="••••••••" required>
                        <span id="passError" class="text-red-500 text-xs font-semibold mt-1 hidden">Passwords do not match</span>
                    </div>
                    
                    <div id="regGlobalError" class="hidden bg-red-50 text-red-600 px-4 py-3 rounded-lg text-sm font-medium border border-red-100 flex items-center gap-2">
                        <i class="fa-solid fa-circle-exclamation"></i>
                        <span id="regGlobalErrorText">An error occurred.</span>
                    </div>

                    <button type="submit" id="regBtn" class="w-full bg-gradient-to-r from-festival-orange to-festival-fuchsia text-white py-3 rounded-lg font-bold shadow-lg hover:shadow-xl hover:scale-[1.02] transition-all duration-300 mt-4">
                        Create Account
                    </button>
                </form>
                
                <p class="mt-8 text-center text-slate-500 font-medium">
                    Already have an account? 
                    <a href="login.html" class="text-festival-fuchsia hover:text-festival-violet font-bold transition-colors">Login here</a>
                </p>
            </div>
        </div>
    </main>

    <div id="footer-placeholder"></div>

    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script src="js/store.js"></script>
    <script src="js/api.js"></script>
    <script src="js/ui.js"></script>
    <script>
        AOS.init();
        UI.init();

        document.getElementById('registerForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            UI.clearError('regEmail', 'emailError');
            UI.clearError('regConfirmPassword', 'passError');
            document.getElementById('regGlobalError').classList.add('hidden');
            
            const name = document.getElementById('regName').value;
            const email = document.getElementById('regEmail').value;
            const password = document.getElementById('regPassword').value;
            const confirm = document.getElementById('regConfirmPassword').value;
            
            let hasError = false;
            
            // Client-side validation
            if(password !== confirm) {
                UI.showError('regConfirmPassword', 'passError', 'Passwords do not match');
                hasError = true;
            }
            if(!email.includes('@')) {
                UI.showError('regEmail', 'emailError', 'Please enter a valid email address');
                hasError = true;
            }
            
            if(hasError) return;
            
            UI.showLoading('regBtn', 'Creating Account...');
            
            try {
                await api.register({ name, email, password });
                window.location.href = 'dashboard.html';
            } catch (error) {
                UI.hideLoading('regBtn');
                document.getElementById('regGlobalErrorText').innerText = error.message;
                document.getElementById('regGlobalError').classList.remove('hidden');
                UI.showError('regEmail', null, null);
            }
        });
    </script>
</body>
</html>
