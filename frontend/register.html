<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - FestiFlow</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container mt-3 mb-3" style="max-width: 450px;">
        <div class="card text-center">
            <h2 class="mb-1" style="color: var(--primary);"><i class="fa-solid fa-user-plus"></i> Join FestiFlow</h2>
            <p class="mb-2 text-center">Create an account to book your slot</p>
            
            <form action="login.html" onsubmit="event.preventDefault(); window.location.href='login.html';">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" class="form-control" placeholder="John Doe" required>
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" class="form-control" placeholder="student@example.com" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" class="form-control" required>
                </div>
                <div class="form-group">
                    <label>Confirm Password</label>
                    <input type="password" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-primary btn-block mt-1">Register</button>
            </form>
            
            <p class="mt-2"><small>Already have an account? <a href="login.html" style="color: var(--primary); font-weight:600;">Login</a></small></p>
        </div>
    </div>
</body>
</html>
