<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Bookings - FestiFlow</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="js/tailwind-config.js"></script>
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/custom.css">
</head>
<body class="bg-slate-50 font-sans min-h-screen flex flex-col">
    
    <div id="navbar-placeholder"></div>

    <main class="flex-grow max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 py-10 w-full">
        <div data-aos="fade-right" data-aos-duration="500">
            <h2 class="text-3xl font-extrabold text-festival-slate mb-2 flex items-center gap-3">
                <i class="fa-solid fa-ticket-simple text-festival-fuchsia"></i> My Bookings
            </h2>
            <p class="text-slate-500 font-medium mb-10">View and manage your upcoming festival immersion slots.</p>
        </div>

        <div id="bookings-container" class="space-y-6">
            <div class="text-center py-12 text-slate-500 font-medium flex flex-col items-center justify-center gap-3">
                <i class="fa-solid fa-circle-notch fa-spin text-3xl text-festival-violet"></i>
                <p>Loading bookings...</p>
            </div>
        </div>
    </main>

    <div id="footer-placeholder"></div>

    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script src="js/store.js"></script>
    <script src="js/api.js"></script>
    <script src="js/ui.js"></script>
    <script>
        AOS.init({ once: true });
        UI.init();

        document.addEventListener("DOMContentLoaded", async () => {
            const currentUser = Store.getCurrentUser();
            if (!currentUser) {
                window.location.href = 'login.html';
                return;
            }

            const container = document.getElementById('bookings-container');
            const allBookings = await api.getBookings();
            
            const userBookings = allBookings.filter(b => b.userId === currentUser.id);

            // Sort: active on top, cancelled on bottom. Then by date desc.
            userBookings.sort((a, b) => {
                if (a.status === 'confirmed' && b.status === 'cancelled') return -1;
                if (a.status === 'cancelled' && b.status === 'confirmed') return 1;
                return new Date(b.createdAt) - new Date(a.createdAt);
            });

            container.innerHTML = '';

            if (userBookings.length === 0) {
                container.innerHTML = `
                    <div class="bg-white rounded-2xl shadow-sm border border-slate-100 p-10 text-center" data-aos="fade-up">
                        <div class="w-20 h-20 bg-slate-50 rounded-full flex items-center justify-center mx-auto mb-4 border border-slate-200">
                            <i class="fa-solid fa-ticket-simple text-3xl text-slate-300"></i>
                        </div>
                        <h3 class="text-xl font-bold text-slate-700 mb-2">No bookings found</h3>
                        <p class="text-slate-500 mb-6 font-medium">You haven't booked any immersion slots yet.</p>
                        <a href="dashboard.html" class="inline-block px-6 py-3 bg-festival-gradient text-white rounded-lg font-bold shadow-md hover:shadow-lg hover:-translate-y-1 transition-all">Explore Festivals</a>
                    </div>
                `;
                return;
            }

            userBookings.forEach((b, index) => {
                const isCancelled = b.status === 'cancelled';
                const opacityClass = isCancelled ? 'opacity-60 grayscale-[50%]' : '';
                const badgeHtml = isCancelled 
                    ? `<span class="px-3 py-1 bg-red-100 text-red-700 border border-red-200 rounded-full text-xs font-bold flex items-center gap-1"><i class="fa-solid fa-ban"></i> CANCELLED</span>` 
                    : `<span class="px-3 py-1 bg-green-100 text-green-700 border border-green-200 rounded-full text-xs font-bold flex items-center gap-1"><i class="fa-solid fa-circle-check"></i> CONFIRMED</span>`;

                const delay = index * 100;

                const cardHtml = `
                    <div class="bg-white rounded-2xl shadow-sm hover:shadow-md border border-slate-200 p-6 sm:p-8 flex flex-col md:flex-row gap-6 transition-all duration-300 ${opacityClass}" data-aos="fade-up" data-aos-delay="${delay}">
                        <div class="flex-grow">
                            <div class="flex flex-wrap justify-between items-start gap-4 mb-4">
                                <div>
                                    <h3 class="text-xl font-bold text-festival-slate mb-1">${b.festivalName}</h3>
                                    <p class="text-slate-500 font-semibold text-sm flex items-center gap-2">
                                        <i class="fa-solid fa-fingerprint text-festival-violet"></i> ID: ${b.id}
                                    </p>
                                </div>
                                <div>${badgeHtml}</div>
                            </div>
                            
                            <div class="grid grid-cols-2 sm:grid-cols-4 gap-4 mt-6 bg-slate-50 p-4 rounded-xl border border-slate-100">
                                <div>
                                    <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-1">Date</p>
                                    <p class="font-bold text-slate-700">${b.date}</p>
                                </div>
                                <div>
                                    <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-1">Time</p>
                                    <p class="font-bold text-slate-700">${b.slotTime}</p>
                                </div>
                                <div>
                                    <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-1">Location</p>
                                    <p class="font-bold text-slate-700">${b.pointName}</p>
                                </div>
                                <div>
                                    <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-1">Group Size</p>
                                    <p class="font-bold text-slate-700 flex items-center gap-2">
                                        <i class="fa-solid fa-users text-festival-fuchsia"></i> ${b.groupSize}
                                    </p>
                                </div>
                            </div>
                        </div>
                        
                        ${!isCancelled ? `
                        <div class="md:w-48 flex flex-col justify-center shrink-0 border-t md:border-t-0 md:border-l border-slate-100 pt-6 md:pt-0 md:pl-6">
                            <a href="confirmation.html?id=${b.id}" class="w-full px-4 py-2 bg-slate-100 text-festival-violet hover:bg-festival-violet hover:text-white rounded-lg font-bold transition-colors text-center text-sm mb-3 border border-slate-200">
                                <i class="fa-solid fa-qrcode mr-1"></i> View Ticket
                            </a>
                            <button onclick="cancelBooking('${b.id}')" class="w-full px-4 py-2 border-2 border-red-100 text-red-500 hover:bg-red-50 hover:border-red-200 rounded-lg font-bold transition-colors text-center text-sm flex items-center justify-center gap-1">
                                <i class="fa-solid fa-xmark"></i> Cancel
                            </button>
                        </div>
                        ` : `
                        <div class="md:w-48 flex flex-col justify-center shrink-0 border-t md:border-t-0 md:border-l border-slate-100 pt-6 md:pt-0 md:pl-6 text-center">
                            <i class="fa-solid fa-calendar-xmark text-4xl text-slate-300"></i>
                            <p class="text-sm font-semibold text-slate-400 mt-2">Slot Restored</p>
                        </div>
                        `}
                    </div>
                `;
                container.insertAdjacentHTML('beforeend', cardHtml);
            });
        });

        window.cancelBooking = async function(id) {
            if(confirm("Are you sure you want to cancel this booking? This action cannot be undone and your slot will be given to someone else.")) {
                try {
                    await api.cancelBooking(id);
                    window.location.reload();
                } catch(e) {
                    alert("Error cancelling booking.");
                }
            }
        };
    </script>
</body>
</html>
