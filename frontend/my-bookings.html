<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Bookings - FestiFlow</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="fade-in">
    <header class="header">
        <div class="container nav">
            <div class="nav-logo"><a href="dashboard.html"><i class="fa-solid fa-water"></i> FestiFlow</a></div>
            <div class="nav-links">
                <a href="dashboard.html">Dashboard</a>
                <a href="index.html" class="btn btn-outline">Logout</a>
            </div>
        </div>
    </header>

    <div class="container mt-3 mb-3">
        <div class="flex flex-between align-center mb-2">
            <h2>My Bookings</h2>
            <span class="badge badge-primary">2 Active</span>
        </div>
        
        <div class="grid">
            <!-- Mock Booking 1 -->
            <div class="card" style="border-top: 4px solid var(--success);">
                <div class="flex flex-between align-center mb-1">
                    <h3>Ganesh Visarjan</h3>
                    <span class="badge badge-success"><i class="fa-solid fa-check"></i> Confirmed</span>
                </div>
                <p class="mb-1" style="font-size:0.9rem; color:var(--text-secondary);"><strong>Booking ID:</strong> BKG-9842</p>
                
                <div style="background: var(--bg-blue); padding: 12px; border-radius: var(--radius-sm); margin-bottom: 15px;">
                    <p style="margin-bottom: 5px;"><i class="fa-solid fa-location-dot" style="color:var(--secondary); width:20px;"></i> <strong>Girgaon Chowpatty</strong></p>
                    <p style="margin-bottom: 5px;"><i class="fa-regular fa-clock" style="color:var(--secondary); width:20px;"></i> 8:00 PM - 9:00 PM</p>
                    <p><i class="fa-solid fa-users" style="color:var(--secondary); width:20px;"></i> Group Size: 4</p>
                </div>

                <div class="flex gap-1">
                    <button class="btn btn-primary btn-block"><i class="fa-solid fa-qrcode"></i> Show Ticket</button>
                    <button class="btn btn-outline" style="border-color: var(--danger); color: var(--danger);"><i class="fa-solid fa-xmark"></i></button>
                </div>
            </div>

            <!-- Mock Booking 2 -->
            <div class="card" style="border-top: 4px solid var(--warning);">
                <div class="flex flex-between align-center mb-1">
                    <h3>Durga Puja</h3>
                    <span class="badge badge-warning"><i class="fa-solid fa-clock-rotate-left"></i> Waitlist</span>
                </div>
                <p class="mb-1" style="font-size:0.9rem; color:var(--text-secondary);"><strong>Booking ID:</strong> BKG-1123</p>
                
                <div style="background: #fffbeb; padding: 12px; border-radius: var(--radius-sm); margin-bottom: 15px;">
                    <p style="margin-bottom: 5px;"><i class="fa-solid fa-location-dot" style="color:var(--warning); width:20px;"></i> <strong>Powai Lake</strong></p>
                    <p style="margin-bottom: 5px;"><i class="fa-regular fa-clock" style="color:var(--warning); width:20px;"></i> 7:00 PM - 8:00 PM</p>
                    <p><i class="fa-solid fa-users" style="color:var(--warning); width:20px;"></i> Group Size: 2</p>
                </div>

                <button class="btn btn-outline btn-block" style="border-color: var(--danger); color: var(--danger);">Leave Waitlist</button>
            </div>
        </div>
    </div>
</body>
</html>
