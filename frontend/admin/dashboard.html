<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - FestiFlow</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="../js/tailwind-config.js"></script>
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/custom.css">
</head>
<body class="bg-slate-50 font-sans min-h-screen flex flex-col">
    
    <div id="navbar-placeholder"></div>

    <main class="flex-grow max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 w-full">
        
        <div class="mb-10" data-aos="fade-right" data-aos-duration="500">
            <h2 class="text-3xl font-extrabold text-festival-slate mb-2 flex items-center gap-3">
                <i class="fa-solid fa-shield-halved text-red-500"></i> Admin Operations
            </h2>
            <p class="text-slate-500 font-medium">System overview and live metrics.</p>
        </div>

        <!-- Metrics Row -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-10">
            <div class="bg-white rounded-2xl shadow-sm border border-slate-100 p-6 flex items-center gap-6" data-aos="fade-up" data-aos-delay="0">
                <div class="w-16 h-16 rounded-full bg-blue-50 flex items-center justify-center border border-blue-100 shrink-0">
                    <i class="fa-solid fa-users text-2xl text-blue-500"></i>
                </div>
                <div>
                    <p class="text-sm font-bold text-slate-400 uppercase tracking-widest mb-1">Total Users</p>
                    <h3 id="admin-total-users" class="text-3xl font-extrabold text-festival-slate"><i class="fa-solid fa-circle-notch fa-spin text-sm text-slate-300"></i></h3>
                </div>
            </div>
            
            <div class="bg-white rounded-2xl shadow-sm border border-slate-100 p-6 flex items-center gap-6" data-aos="fade-up" data-aos-delay="100">
                <div class="w-16 h-16 rounded-full bg-green-50 flex items-center justify-center border border-green-100 shrink-0">
                    <i class="fa-solid fa-ticket text-2xl text-green-500"></i>
                </div>
                <div>
                    <p class="text-sm font-bold text-slate-400 uppercase tracking-widest mb-1">Active Bookings</p>
                    <h3 id="admin-active-bookings" class="text-3xl font-extrabold text-festival-slate"><i class="fa-solid fa-circle-notch fa-spin text-sm text-slate-300"></i></h3>
                </div>
            </div>
            
            <div class="bg-white rounded-2xl shadow-sm border border-red-100 p-6 flex items-center gap-6 relative overflow-hidden" data-aos="fade-up" data-aos-delay="200">
                <div class="absolute -right-4 -top-4 w-24 h-24 bg-red-50 rounded-full z-0"></div>
                <div class="w-16 h-16 rounded-full bg-red-100 flex items-center justify-center border border-red-200 shrink-0 z-10 relative">
                    <i class="fa-solid fa-fire text-2xl text-red-500 animate-pulse"></i>
                </div>
                <div class="z-10 relative">
                    <p class="text-sm font-bold text-red-400 uppercase tracking-widest mb-1">High Crowd Spots</p>
                    <h3 id="admin-high-crowd" class="text-3xl font-extrabold text-red-600"><i class="fa-solid fa-circle-notch fa-spin text-sm text-red-300"></i></h3>
                </div>
            </div>
        </div>

        <!-- Recent Bookings Table -->
        <div class="bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden" data-aos="fade-up" data-aos-delay="300">
            <div class="px-6 py-5 border-b border-slate-100 bg-slate-50 flex justify-between items-center">
                <h3 class="text-lg font-bold text-festival-slate flex items-center gap-2">
                    <i class="fa-solid fa-clock-rotate-left text-festival-violet"></i> Recent Activity
                </h3>
                <span class="text-xs font-bold text-slate-400 uppercase tracking-wider">Latest 10</span>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-white text-xs font-bold text-slate-400 uppercase tracking-wider border-b border-slate-100">
                            <th class="px-6 py-4">Booking ID</th>
                            <th class="px-6 py-4">User</th>
                            <th class="px-6 py-4">Slot Details</th>
                            <th class="px-6 py-4">Group</th>
                            <th class="px-6 py-4">Status</th>
                        </tr>
                    </thead>
                    <tbody id="admin-recent-bookings" class="divide-y divide-slate-100">
                        <tr>
                            <td colspan="5" class="px-6 py-10 text-center text-slate-500 font-medium">
                                <i class="fa-solid fa-circle-notch fa-spin mr-2 text-festival-violet"></i> Loading booking data...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
        
    </main>

    <div id="footer-placeholder"></div>

    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script src="../js/store.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/ui.js"></script>
    <script>
        AOS.init({ once: true });
        UI.init();

        document.addEventListener("DOMContentLoaded", async () => {
            const currentUser = Store.getCurrentUser();
            if (!currentUser || currentUser.isAdmin !== true) {
                window.location.href = '../login.html';
                return;
            }

            try {
                const users = await api.getUsers();
                const bookings = await api.getBookings();
                const slots = await api.getSlots();

                const totalUsers = users.length;
                const activeBookings = bookings.filter(b => b.status === 'confirmed');
                const highCrowdSpots = slots.filter(s => s.capacityTotal > 0 && (s.capacityRemaining / s.capacityTotal) < 0.2).length;

                document.getElementById('admin-total-users').innerText = totalUsers.toLocaleString();
                document.getElementById('admin-active-bookings').innerText = activeBookings.length.toLocaleString();
                document.getElementById('admin-high-crowd').innerText = highCrowdSpots;

                const tableBody = document.getElementById('admin-recent-bookings');
                
                if (bookings.length === 0) {
                    tableBody.innerHTML = `
                        <tr>
                            <td colspan="5" class="px-6 py-10 text-center text-slate-400 font-medium bg-slate-50 border-dashed border-2 border-slate-200">
                                No bookings found in the system.
                            </td>
                        </tr>`;
                } else {
                    tableBody.innerHTML = '';
                    const latestBookings = [...bookings].sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt)).slice(0, 10);
                    
                    latestBookings.forEach(b => {
                        const isCancelled = b.status === 'cancelled';
                        const badgeHtml = isCancelled 
                            ? `<span class="px-2 py-1 bg-red-50 text-red-600 border border-red-200 rounded text-[10px] font-bold tracking-wider">CANCELLED</span>`
                            : `<span class="px-2 py-1 bg-green-50 text-green-600 border border-green-200 rounded text-[10px] font-bold tracking-wider">CONFIRMED</span>`;
                        
                        const rowOpacity = isCancelled ? 'opacity-60 bg-slate-50' : 'hover:bg-slate-50 transition-colors';

                        const row = document.createElement('tr');
                        row.className = rowOpacity;
                        row.innerHTML = `
                            <td class="px-6 py-4 font-bold text-slate-700 text-sm">${b.id}</td>
                            <td class="px-6 py-4">
                                <p class="font-bold text-slate-800 text-sm">${b.userName || 'User'}</p>
                                <p class="text-xs text-slate-400 font-medium">${b.userEmail || 'N/A'}</p>
                            </td>
                            <td class="px-6 py-4">
                                <p class="font-bold text-slate-700 text-sm">${b.pointName || 'Unknown Point'}</p>
                                <p class="text-xs text-slate-500 font-medium"><i class="fa-regular fa-clock"></i> ${b.slotTime || 'Unknown Time'}</p>
                            </td>
                            <td class="px-6 py-4 font-bold text-slate-700 flex items-center gap-1 mt-2">
                                <i class="fa-solid fa-users text-festival-fuchsia text-xs"></i> ${b.groupSize}
                            </td>
                            <td class="px-6 py-4">
                                ${badgeHtml}
                            </td>
                        `;
                        tableBody.appendChild(row);
                    });
                }
            } catch (err) {
                console.error("Admin Dashboard Error:", err);
            }
        });
    </script>
</body>
</html>
