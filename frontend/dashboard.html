<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - FestiFlow</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="js/tailwind-config.js"></script>
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/custom.css">
</head>
<body class="bg-slate-50 font-sans min-h-screen flex flex-col">
    
    <div id="navbar-placeholder"></div>

    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 flex-grow w-full">
        <div class="grid grid-cols-1 lg:grid-cols-4 gap-8">
            <!-- Main Content -->
            <main class="lg:col-span-3">
                <div data-aos="fade-right" data-aos-duration="500">
                    <h2 id="welcomeMsg" class="text-3xl font-extrabold text-festival-slate mb-2">Welcome back!</h2>
                    <p class="text-slate-500 font-medium mb-8">Manage your festival bookings and explore upcoming events.</p>
                </div>
                
                <!-- Smart Slot Card -->
                <div class="bg-gradient-to-r from-festival-violet to-festival-fuchsia rounded-2xl p-6 sm:p-8 shadow-lg text-white mb-10 relative overflow-hidden group" data-aos="zoom-in" data-aos-duration="500">
                    <div class="absolute -right-10 -top-10 w-40 h-40 bg-white opacity-10 rounded-full mix-blend-overlay group-hover:scale-150 transition-transform duration-700"></div>
                    
                    <div class="relative z-10 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-6">
                        <div>
                            <h3 class="text-2xl font-bold mb-2 flex items-center gap-2">
                                <i class="fa-solid fa-wand-magic-sparkles"></i> Smart Slot Selection
                            </h3>
                            <p class="text-white/80 font-medium">Let FestiFlow find a suitable low-crowd slot for you automatically.</p>
                        </div>
                        <a href="points.html?smart=true" class="shrink-0 px-6 py-3 bg-white text-festival-violet rounded-full font-bold shadow-md hover:shadow-xl hover:scale-105 transition-all duration-300">
                            Find Best Slot
                        </a>
                    </div>
                </div>
                
                <h3 class="text-2xl font-bold text-festival-slate mb-6 flex items-center gap-2">
                    <i class="fa-solid fa-fire text-festival-orange"></i> Featured Festivals
                </h3>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-6" id="festivals-container">
                    <!-- Data loaded via dashboard.js -->
                    <div class="col-span-full text-center py-10 text-slate-500 font-medium">
                        <i class="fa-solid fa-circle-notch fa-spin mr-2"></i> Loading festivals...
                    </div>
                </div>
            </main>
            
            <!-- Sidebar -->
            <aside class="lg:col-span-1">
                <div class="bg-white rounded-2xl shadow-sm border border-slate-100 p-6 sticky top-24" data-aos="fade-left" data-aos-duration="500">
                    <h3 class="text-xl font-bold text-festival-slate mb-4 flex items-center gap-2">
                        <i class="fa-solid fa-bell text-festival-orange"></i> Live Alerts
                    </h3>
                    <div id="live-alerts-container" class="space-y-4">
                        <div class="text-slate-500 font-medium text-sm flex items-center gap-2">
                            <i class="fa-solid fa-circle-notch fa-spin"></i> Loading live alerts...
                        </div>
                    </div>
                </div>
            </aside>
        </div>
    </div>

    <div id="footer-placeholder"></div>

    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script src="js/store.js"></script>
    <script src="js/api.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/dashboard.js"></script>
    <script>
        AOS.init({ once: true });
        UI.init();

        document.addEventListener("DOMContentLoaded", () => {
            const currentUser = Store.getCurrentUser();
            if (!currentUser) {
                window.location.href = 'login.html';
                return;
            }
            document.getElementById('welcomeMsg').innerText = `Welcome back, ${currentUser.name.split(' ')[0]}!`;
        });
    </script>
</body>
</html>
