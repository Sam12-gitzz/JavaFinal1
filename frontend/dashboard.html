<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - FestiFlow</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="fade-in">
    <header class="header">
        <div class="container nav">
            <div class="nav-logo"><a href="dashboard.html"><i class="fa-solid fa-water"></i> FestiFlow</a></div>
            <div class="nav-links">
                <a href="dashboard.html" style="color: var(--primary); font-weight: 600;">Dashboard</a>
                <a href="my-bookings.html">My Bookings</a>
                <a href="index.html" class="btn btn-outline" onclick="localStorage.removeItem('currentUser')">Logout</a>
            </div>
        </div>
    </header>

    <div class="container dashboard-layout">
        <main>
            <h2 id="welcomeMsg" class="mb-1">Welcome back, Student!</h2>
            <p class="mb-2">Manage your festival bookings and explore upcoming events.</p>
            
            <div class="card smart-card mb-3">
                <div class="flex flex-between align-center">
                    <div>
                        <h3 class="smart-card-header"><i class="fa-solid fa-wand-magic-sparkles"></i> Smart Slot Selection</h3>
                        <p class="mt-1" style="color: var(--text-primary);">Let FestiFlow find a suitable low-crowd slot for you.</p>
                    </div>
                    <a href="points.html?smart=true" class="btn btn-primary" style="position: relative; z-index: 1;">Find Best Slot</a>
                </div>
            </div>
            
            <h3 class="mb-2">Featured Festivals</h3>
            <div class="grid" id="festivals-container">
                <!-- Data loaded via dashboard.js -->
            </div>
        </main>
        
        <aside>
            <h3 class="mb-2">Live Crowd Alerts</h3>
            <div id="live-alerts-container">
                <p style="font-size: 0.9rem; color: var(--text-secondary);"><i class="fa-solid fa-circle-notch fa-spin"></i> Loading live alerts...</p>
            </div>
        </aside>
    </div>

    <script src="js/api.js"></script>
    <script src="js/dashboard.js"></script>
</body>
</html>
