# ==========================================
# Server Configuration
# ==========================================
server.port=8080

# ==========================================
# H2 Database Configuration (File-based)
# ==========================================
# This creates a file-based database in a folder called 'data' in the project root
spring.datasource.url=jdbc:h2:file:./data/festiflowdb;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password

# Enable H2 web console to view the database visually
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ==========================================
# JPA / Hibernate Configuration
# ==========================================
# 'update' automatically updates the DB schema without dropping existing data
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Show the SQL queries Hibernate generates in the terminal
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
