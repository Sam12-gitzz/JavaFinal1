<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - FestiFlow</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="js/tailwind-config.js"></script>
    <!-- AOS CSS -->
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS (Scrollbars/Glassmorphism) -->
    <link rel="stylesheet" href="css/custom.css">
</head>
<body class="bg-slate-50 font-sans min-h-screen flex flex-col justify-between">
    
    <div id="navbar-placeholder"></div>

    <main class="flex-grow flex items-center justify-center p-4">
        <div class="w-full max-w-md bg-white rounded-2xl shadow-xl overflow-hidden" data-aos="zoom-in" data-aos-duration="500">
            <div class="h-2 bg-festival-gradient w-full"></div>
            <div class="p-8 sm:p-10">
                <div class="w-20 h-20 bg-slate-100 rounded-full flex items-center justify-center mx-auto mb-6 shadow-inner">
                    <i class="fa-solid fa-water text-3xl text-festival-violet"></i>
                </div>
                
                <h2 class="text-3xl font-extrabold text-center text-festival-slate mb-2">Welcome Back</h2>
                <p class="text-center text-slate-500 mb-8 font-medium">Login to manage your festive bookings</p>
                
                <form id="loginForm" class="space-y-6">
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-2">Email Address</label>
                        <input type="email" id="loginEmail" class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-festival-violet focus:border-transparent transition-colors shadow-sm outline-none" placeholder="student@example.com" required>
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-2">Password</label>
                        <input type="password" id="loginPassword" class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-festival-violet focus:border-transparent transition-colors shadow-sm outline-none" placeholder="••••••••" required>
                    </div>
                    
                    <div id="loginError" class="hidden bg-red-50 text-red-600 px-4 py-3 rounded-lg text-sm font-medium border border-red-100 flex items-center gap-2">
                        <i class="fa-solid fa-circle-exclamation"></i>
                        <span id="loginErrorText">Invalid email or password.</span>
                    </div>

                    <button type="submit" id="loginBtn" class="w-full bg-festival-gradient text-white py-3 rounded-lg font-bold shadow-lg hover:shadow-xl hover:scale-[1.02] transition-all duration-300">
                        Login <i class="fa-solid fa-arrow-right ml-2"></i>
                    </button>
                </form>
                
                <p class="mt-8 text-center text-slate-500 font-medium">
                    Don't have an account? 
                    <a href="register.html" class="text-festival-violet hover:text-festival-fuchsia font-bold transition-colors">Create one</a>
                </p>
            </div>
        </div>
    </main>

    <div id="footer-placeholder"></div>

    <!-- Scripts -->
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script src="js/store.js"></script>
    <script src="js/api.js"></script>
    <script src="js/ui.js"></script>
    <script>
        AOS.init();
        UI.init();

        Store.clearCurrentUser();

        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            UI.clearError('loginEmail', 'loginError');
            UI.clearError('loginPassword', 'loginError');
            
            const email = document.getElementById('loginEmail').value;
            const pass = document.getElementById('loginPassword').value;
            
            UI.showLoading('loginBtn', 'Authenticating...');
            
            try {
                await api.login(email, pass);
                window.location.href = 'dashboard.html';
            } catch (error) {
                UI.hideLoading('loginBtn');
                document.getElementById('loginErrorText').innerText = error.message;
                document.getElementById('loginError').classList.remove('hidden');
                UI.showError('loginEmail', null, null);
                UI.showError('loginPassword', null, null);
            }
        });
    </script>
</body>
</html>
